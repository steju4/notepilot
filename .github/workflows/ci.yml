name: NotePilot checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/install.py --dev
      - run: .venv/bin/python -m pytest backend/tests -q
      - run: .venv/bin/ruff check --config ruff.toml backend scripts
      - run: npm --prefix frontend test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NOTEPILOT_INCLUDE_MODELS=1 --build-arg NOTEPILOT_INCLUDE_AUDIVERIS=1 --build-arg VITE_NOTEPILOT_HOSTED=1 -t notepilot-ci .
      - run: >-
          docker run --rm --init --network none --cpus 2 --memory 4g
          --mount type=bind,src=${{ github.workspace }}/examples/corpus,dst=/input,readonly
          --entrypoint /app/.venv/bin/python notepilot-ci /app/scripts/verify_container.py
