services:
  notepilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - notepilot-data:/data
    environment:
      NOTEPILOT_DATA_DIR: /data
      NOTEPILOT_MAX_UPLOAD_MB: "40"
      NOTEPILOT_OMR_TIMEOUT: "900"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/scripts/container_health.py"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  notepilot-data:
