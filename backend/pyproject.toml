[project]
name = "notepilot-backend"
version = "0.1.0"
description = "NotePilot local music and OMR service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=12.1.1,<13", "opencv-python-headless>=4.13,<5", "numpy>=2.4,<3",
  "music21>=9.7,<10", "pypdfium2>=4.30,<6", "defusedxml>=0.7.1,<1", "mido>=1.3,<2",
  "pyjwt[crypto]>=2.10,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
